[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "solar-station"
version = "0.2.0"
description = "Persistent multi-client host service for Solar Remote"
requires-python = ">=3.11"
dependencies = [
    "cbor2>=5.6",
    "platformdirs>=4.0",
    "pyserial>=3.5",
    "solar-remote>=0.1.0",
    "websockets>=14,<17",
]

[project.optional-dependencies]
test = ["pytest>=8", "pytest-asyncio>=0.24", "ruff>=0.9"]

[project.scripts]
solar-stationd = "solar_station.service:main"

[tool.hatch.build.targets.wheel]
packages = ["src/solar_station"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

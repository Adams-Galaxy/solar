CONFIG_ZTEST=y
CONFIG_CPP=y
CONFIG_STD_CPP23=y
CONFIG_REQUIRES_FULL_LIBCPP=y
CONFIG_CPP_EXCEPTIONS=n
CONFIG_CPP_RTTI=n
CONFIG_COMPILER_WARNINGS_AS_ERRORS=y
CONFIG_MAIN_STACK_SIZE=8192
CONFIG_SOLAR=y
CONFIG_SOLAR_REMOTE=y
CONFIG_SOLAR_REMOTE_GENERATE_MANIFEST=n
# Short enough that the stall-timeout-abort test runs quickly without being
# indistinguishable from ordinary scheduling jitter in native_sim.
CONFIG_SOLAR_REMOTE_OUTBOUND_STALL_TIMEOUT_MS=200

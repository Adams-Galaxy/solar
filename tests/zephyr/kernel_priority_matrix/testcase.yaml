tests:
  solar.kernel.priority.mixed:
    build_only: true
    platform_allow:
      - native_sim/native/64
    tags:
      - solar
      - kernel
      - priority
  solar.kernel.priority.cooperative_only:
    build_only: true
    platform_allow:
      - native_sim/native/64
    extra_configs:
      - CONFIG_NUM_COOP_PRIORITIES=4
      - CONFIG_NUM_PREEMPT_PRIORITIES=0
      - CONFIG_MAIN_THREAD_PRIORITY=-1
      - CONFIG_SYSTEM_WORKQUEUE_PRIORITY=-1
      - CONFIG_SOLAR_APPLICATION_DEFAULT_SERVICE_PRIORITY_COOPERATIVE=y
      - CONFIG_SOLAR_APPLICATION_DEFAULT_SERVICE_PRIORITY_LEVEL=0
    tags:
      - solar
      - kernel
      - priority
  solar.kernel.priority.preemptive_only:
    build_only: true
    platform_allow:
      - native_sim/native/64
    extra_configs:
      - CONFIG_NUM_COOP_PRIORITIES=0
      - CONFIG_NUM_PREEMPT_PRIORITIES=4
      - CONFIG_MAIN_THREAD_PRIORITY=0
      - CONFIG_SYSTEM_WORKQUEUE_PRIORITY=1
    tags:
      - solar
      - kernel
      - priority
  solar.kernel.priority.reduced_mixed:
    build_only: true
    platform_allow:
      - native_sim/native/64
    extra_configs:
      - CONFIG_NUM_COOP_PRIORITIES=3
      - CONFIG_NUM_PREEMPT_PRIORITIES=5
    tags:
      - solar
      - kernel
      - priority
  solar.kernel.priority.metairq:
    build_only: true
    platform_allow:
      - native_sim/native/64
    extra_configs:
      - CONFIG_NUM_COOP_PRIORITIES=4
      - CONFIG_NUM_PREEMPT_PRIORITIES=4
      - CONFIG_NUM_METAIRQ_PRIORITIES=1
    tags:
      - solar
      - kernel
      - priority

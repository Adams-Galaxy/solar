name: Documentation

on:
  pull_request:
    paths:
      - ".github/workflows/documentation.yml"
      - "docs/**"
      - "include/solar/**"
      - "zephyr/Kconfig"
  push:
    branches:
      - main
      - static_reform
    tags:
      - "v*"

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: docs/requirements.txt
      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install --yes doxygen graphviz
      - name: Install documentation dependencies
        run: python -m pip install -r docs/requirements.txt
      - name: Configure documentation
        run: cmake -S docs -B build/docs
      - name: Build warning-fatal HTML
        run: cmake --build build/docs --target docs-html
      - name: Check links
        run: cmake --build build/docs --target docs-linkcheck
      - name: Package versioned site
        run: cmake --build build/docs --target docs-site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/docs/site

  deploy:
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy documentation
        id: deployment
        uses: actions/deploy-pages@v4
